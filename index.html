<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Mi Dieta</title>

<meta name="description" content="Gestión semanal de dieta y lista de la compra">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

<!-- Pantalla de inicio de iOS -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dieta">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="manifest" href="manifest.webmanifest">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">

  <!-- Barra de navegación -->
  <header class="nav" id="nav">
    <div class="nav-bar">
      <button class="nav-btn" id="navLeft" hidden></button>
      <span class="nav-title" id="navTitle">Semana</span>
      <button class="nav-btn nav-btn-right" id="navRight" hidden></button>
    </div>
    <h1 class="large-title" id="largeTitle">Semana</h1>
  </header>

  <!-- Contenido -->
  <main id="main">
    <section class="view" id="view-semana" data-vista="semana"></section>
    <section class="view" id="view-compra" data-vista="compra" hidden></section>
    <section class="view" id="view-ajustes" data-vista="ajustes" hidden></section>
  </main>

  <!-- Barra de pestañas -->
  <nav class="tabbar" id="tabbar">
    <button class="tab is-active" data-vista="semana">
      <svg viewBox="0 0 28 28" aria-hidden="true"><path d="M6 5.5h16a2.5 2.5 0 0 1 2.5 2.5v14A2.5 2.5 0 0 1 22 24.5H6A2.5 2.5 0 0 1 3.5 22V8A2.5 2.5 0 0 1 6 5.5Z"/><path d="M3.5 11h21M9 3.5v4M19 3.5v4" class="stroke-only"/></svg>
      <span>Semana</span>
    </button>
    <button class="tab" data-vista="compra">
      <svg viewBox="0 0 28 28" aria-hidden="true"><path d="M8 9h13.2a1 1 0 0 1 .98 1.2l-1.6 8A2 2 0 0 1 18.62 20H11a2 2 0 0 1-1.96-1.6L6.6 6.2A1.5 1.5 0 0 0 5.13 5H3.5"/><circle cx="11" cy="23.2" r="1.6"/><circle cx="19" cy="23.2" r="1.6"/></svg>
      <span>Compra</span>
    </button>
    <button class="tab" data-vista="ajustes">
      <svg viewBox="0 0 28 28" aria-hidden="true"><path d="M4 8h6M16 8h8M4 19h10M20 19h4"/><circle cx="13" cy="8" r="3"/><circle cx="17" cy="19" r="3"/></svg>
      <span>Ajustes</span>
    </button>
  </nav>

</div>

<!-- Capa para hojas modales y avisos -->
<div id="sheetHost"></div>
<div id="toastHost" class="toast-host" aria-live="polite"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
